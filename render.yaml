services:
  - type: web
    name: tweet-scraper
    env: python
    runtime: python-3.11.9
    buildCommand: python3.11 -m pip install -r requirements.txt || python3 -m pip install -r requirements.txt || pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

